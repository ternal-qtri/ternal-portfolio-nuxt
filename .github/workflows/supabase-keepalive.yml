# Supabase pauses free projects after a week without activity.
# A tiny read every 2 days keeps the database awake.
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 3 */2 * *' # 03:00 UTC (10:00 Vietnam) every 2 days
  workflow_dispatch: # allow a manual run from the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      # Public values (same as wrangler.jsonc); RLS only allows reading public content.
      SUPABASE_URL: https://mdvqbvnyakxhmmfeeqij.supabase.co
      SUPABASE_KEY: sb_publishable_WAiIGaVIK8RejxPHVy8Rlg_P-0KsDK5
    steps:
      - name: Query profile
        run: |
          body=$(curl -sS --fail-with-body --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/profile?select=name" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
          echo "$body"
          # An empty array means the query ran but returned nothing: treat as a failure worth a look.
          [ "$body" != "[]" ]
